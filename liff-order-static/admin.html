<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訂單後台 Aceeprint 愛色智能印刷</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; background: #f4f6f9; color: #222; }
  header { background: #0f2537; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  header b { font-size: 16px; }
  .wrap { max-width: 900px; margin: 20px auto; padding: 0 14px; }
  .bar { background: #fff; border: 1px solid #dde3ea; border-radius: 10px; padding: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .bar input { flex: 1; min-width: 220px; padding: 9px 10px; border: 1px solid #c9d2dc; border-radius: 7px; font-size: 14px; }
  .bar button { padding: 9px 18px; border: 0; border-radius: 7px; background: #0f2537; color: #fff; font-size: 14px; cursor: pointer; }
  .bar .hint { color: #a34; font-size: 12px; width: 100%; }
  .card { background: #fff; border: 1px solid #dde3ea; border-radius: 10px; margin: 12px 0; padding: 14px 16px; }
  .card .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
  .card .no { font-weight: 700; font-size: 15px; }
  .card .st { font-size: 12px; padding: 2px 8px; border-radius: 20px; }
  .st.red { background: #fbe4e4; color: #b33; }
  .st.green { background: #e2f3e6; color: #287a3a; }
  .st.gray { background: #eceff3; color: #666; }
  .meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 14px; margin: 10px 0; font-size: 13px; color: #444; }
  .meta b { color: #222; }
  .files { border-top: 1px dashed #dde3ea; margin-top: 8px; padding-top: 8px; }
  .frow { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
  .frow .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frow .qty { color: #888; white-space: nowrap; }
  .dl { color: #1a6fb0; text-decoration: none; white-space: nowrap; }
  .dl:hover { text-decoration: underline; }
  .zipbtn { display: inline-block; margin-top: 8px; padding: 8px 16px; background: #1a6fb0; color: #fff; border-radius: 7px; text-decoration: none; font-size: 14px; }
  .pb-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #dde3ea; }
  .pb-row button { padding: 8px 12px; border: 0; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600; color: #fff; }
  .pb-xls { background: #2e7d46; }
  .pb-work { background: #2f6f7d; }
  .pb-qc { background: #5a3f8f; }
  .confirm { margin-top: 12px; border: 1px solid #a9c9a0; border-radius: 8px; padding: 10px; background: #fbfdf9; }
  .confirm-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .confirm-head button { margin-left: auto; }
  .dtfr-note { background: #fdf3d7; border: 1px solid #e6c966; color: #7a5c00; font-size: 12px; padding: 3px 8px; border-radius: 5px; }
  .conf-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .conf-table th, .conf-table td { border: 1px solid #bcccba; padding: 4px 6px; }
  .conf-table th { background: #e5efe2; text-align: center; }
  .conf-table input { width: 90px; padding: 4px 6px; border: 1px solid #b9cfb4; border-radius: 5px; font-size: 13px; }
  .conf-total td { background: #edf5ea; font-weight: 700; text-align: right; }
  .conf-total td:first-child { text-align: right; }
  .conf-foot { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 13px; }
  .conf-foot input { width: 90px; padding: 4px 6px; border: 1px solid #b9cfb4; border-radius: 5px; font-size: 13px; }
  .conf-foot b { font-size: 16px; }
  .warn { color: #c0392b; font-weight: 700; }
  .warn-note { color: #c0392b; background: #fdecea; border: 1px solid #f0b8b2; padding: 3px 8px; border-radius: 5px; }
  .empty { color: #888; text-align: center; padding: 40px 0; }
  .err { color: #b33; }
</style>
</head>
<body>
<header><b>訂單後台</b><span style="opacity:.7">Aceeprint 愛色智能印刷</span></header>
<div class="wrap">
  <div class="bar" id="loginBar">
    <input id="api" placeholder="後端網址" value="https://shubei-liff-order.shubei-liff-worker.workers.dev">
    <input id="username" placeholder="帳號" value="admin" autocomplete="username">
    <input id="password" type="password" placeholder="密碼" autocomplete="current-password">
    <button onclick="login()">登入</button>
    <div class="hint">預設帳號：admin / 密碼：admin123（請盡快修改）</div>
  </div>
  <div class="bar" id="mainBar" hidden>
    <input id="api2" placeholder="後端網址" value="https://shubei-liff-order.shubei-liff-worker.workers.dev">
    <button onclick="load()">載入訂單</button>
    <button onclick="logout()" class="pb-row" style="background:#c0392b">登出</button>
    <div class="hint">JWT Token 存在 localStorage，重新整理保持登入。點登出清除。</div>
  </div>
  <div id="list"></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const TOKEN_KEY = "admin_jwt";
  let orders = [];

  // 初始化：檢查是否已有 token
  function initAuth() {
    const token = localStorage.getItem(TOKEN_KEY);
    if (token) {
      $("loginBar").hidden = true;
      $("mainBar").hidden = false;
      $("api2").value = $("api").value;
      load();
    }
  }

  async function login() {
    const api = $("api").value.trim().replace(/\/+$/, "");
    const username = $("username").value.trim();
    const password = $("password").value;
    if (!username || !password) { alert("請輸入帳號密碼"); return; }
    try {
      const r = await fetch(api + "/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "登入失敗");
      localStorage.setItem(TOKEN_KEY, data.token);
      $("loginBar").hidden = true;
      $("mainBar").hidden = false;
      $("api2").value = api;
      load();
    } catch (e) { alert("登入失敗：" + e.message); }
  }

  function logout() {
    localStorage.removeItem(TOKEN_KEY);
    $("loginBar").hidden = false;
    $("mainBar").hidden = true;
    $("list").innerHTML = "";
    $("password").value = "";
  }

  function getAuthHeaders() {
    const token = localStorage.getItem(TOKEN_KEY);
    return token ? { "Authorization": "Bearer " + token } : {};
  }

  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&", "<":"<", ">":">", '"':""", "'":"'" }[c])); }
  function fmtSize(n) { n = Number(n) || 0; const u = ["B","KB","MB","GB"]; let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return n.toFixed(n >= 10 || i === 0 ? 0 : 1) + " " + u[i]; }
  function stateCls(s) { return s === "received" ? "red" : (s === "files_uploaded" ? "green" : "gray"); }
  function stateLbl(s) { return s === "received" ? "已收單（尚未傳檔）" : (s === "files_uploaded" ? "檔案已上傳" : s); }
  function fmtDate(iso, hasTime) { try { const d = new Date(iso); if (isNaN(d)) return iso; return hasTime ? d.toLocaleString("zh-TW", { hour12: false }) : d.toLocaleDateString("zh-TW"); } catch (e) { return iso; } }
  function kv(label, val) { return val === undefined || val === null || String(val).trim() === "" ? "" : `<div><b>${esc(label)}</b> ${esc(val)}</div>`; }
  function fmtMoney(v) { const n = Number(v) || 0; return n ? n.toLocaleString("zh-TW", { maximumFractionDigits: 2 }) : ""; }
  function fmtDec(v) { const n = Number(v) || 0; return n ? n.toLocaleString("zh-TW", { maximumFractionDigits: 3 }) : ""; }

  /* ---- 檔案編號規則（依產品類型前綴） ---- */
  function getFilePrefix(productType) {
    const p = String(productType || "");
    if (p.includes("R to R")) return "DTFR";
    if (p.includes("A3")) return "DTFA";
    if (p.includes("紡織") && p.includes("直噴")) return "DTG";
    if (p.includes("燙金")) return "UVDTFG";
    if (p.includes("水晶標")) return "UVF";
    if (p.includes("UV") && p.includes("直噴")) return "UVDTO";
    return "QT";
  }
  function fileNumbers(o) {
    const prefix = getFilePrefix(o.product_type);
    return (o.files || []).map((_, i) => `${prefix}-${String(i + 1).padStart(3, "0")}`);
  }

  /* ---- 試算表：長度/單價的保存與計算 ---- */
  function readConf() { try { return JSON.parse(localStorage.getItem("confirm_data") || "{}"); } catch (e) { return {}; } }
  function saveConf(no, obj) { const d = readConf(); d[no] = obj; localStorage.setItem("confirm_data", JSON.stringify(d)); }
  function confFor(no) {
    const d = readConf()[no];
    if (!d) return { rows: [], price: 0 };
    if (Array.isArray(d)) return { rows: d.map(x => ({ len: Number(x.len) || 0 })), price: 0 };  // 舊格式相容
    return d;
  }
  function parseDim(s) {
    const m = String(s || "").match(/(\d+(?:\.\d+)?)\s*[xX×*]\s*(\d+(?:\.\d+)?)/);
    return m ? [parseFloat(m[1]), parseFloat(m[2])] : [null, null];
  }
  function unitOf(o) { const u = String(o.unit || "").trim(); return (u === "張" || u === "件" || u === "個") ? u : "個"; }
  function recalcBlock(no) {
    const block = document.querySelector(`[data-cblock="${no}"]`);
    if (!block) return;
    const isLen = block.getAttribute("data-islen") === "1";
    const savedRows = [];
    if (isLen) {
      let totalLen = 0;
      block.querySelectorAll("tr[data-i]").forEach(tr => {
        const len = parseFloat(tr.querySelector(".c-len").value) || 0;
        totalLen += len;
        savedRows.push({ len });
      });
      const price = parseFloat(block.querySelector(".c-price").value) || 0;
      const fee = totalLen > 0 && price > 0 ? totalLen * price : 0;
      const tl = document.getElementById("tot-len-" + no);
      const fe = document.getElementById("fee-" + no);
      if (tl) tl.textContent = totalLen ? fmtDec(totalLen) + " m" : "";
      if (fe) fe.textContent = fmtMoney(fee);
      saveConf(no, { rows: savedRows, price });
    } else {
      let totalAmt = 0;
      block.querySelectorAll("tr[data-i]").forEach(tr => {
        const qty = Number(tr.getAttribute("data-q")) || 1;
        const price = parseFloat(tr.querySelector(".c-price").value) || 0;
        const amt = qty * price;
        tr.querySelector(".c-amt").textContent = fmtMoney(amt);
        totalAmt += amt;
        savedRows.push({ price });
      });
      const ta = document.getElementById("tot-amt-" + no);
      const at = document.querySelector(`[data-cblock="${no}"] .price-unit`);
      if (ta) ta.textContent = fmtMoney(totalAmt);
      if (at) at.textContent = "NT$/" + at.getAttribute("data-unit");
      saveConf(no, { rows: savedRows, price: 0 });
    }
  }

  /* ---- XLSX 產生器（STORE zip + Excel OpenXML，不需任何套件） ---- */
  let __crcTable = null;
  function crc32Bytes(bytes) {
    if (!__crcTable) {
      __crcTable = new Uint32Array(256);
      for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); __crcTable[i] = c >>> 0; }
    }
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = __crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function encStr(s) { return new TextEncoder().encode(s); }
  function makeZip(files) { // files: [{name, data: Uint8Array}]
    const parts = [], central = [];
    let offset = 0;
    for (const f of files) {
      const name = encStr(f.name), data = f.data, flags = 0x0800;
      const crc = crc32Bytes(data);
      const head = new Uint8Array(30);
      const dv = new DataView(head.buffer);
      dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, flags, true);
      dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
      dv.setUint32(14, crc, true); dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true);
      dv.setUint16(26, name.length, true); dv.setUint16(28, 0, true);
      parts.push(head, name, data);
      const cen = new Uint8Array(46);
      const cv = new DataView(cen.buffer);
      cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, flags, true);
      cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
      cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
      cv.setUint16(28, name.length, true); cv.setUint32(42, offset, true);
      central.push(cen, name);
      offset += 30 + name.length + data.length;
    }
    const cdSize = central.reduce((s, c) => s + c.length, 0);
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true); ev.setUint16(20, 0, true);
    const all = [...parts, ...central, end];
    let total = 0; all.forEach(p => total += p.length);
    const out = new Uint8Array(total);
    let pos = 0; for (const p of all) { out.set(p, pos); pos += p.length; }
    return out;
  }
  function xlsCol(i) { let s = ""; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
  function buildXlsx(sheetName, headerRow, rows) { // rows: array of arrays（string | number）
    const escXml = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&apos;" }[c]));
    const cellsFor = (arr, r) => arr.map((v, ci) => {
      const ref = xlsCol(ci) + r;
      if (typeof v === "number") return `<c r="${ref}"><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${escXml(v)}</t></is></c>`;
    }).join("");
    const hdr = headerRow.map((h, ci) => `<c r="${xlsCol(ci)}1" t="inlineStr" s="1"><is><t xml:space="preserve">${escXml(h)}</t></is></c>`).join("");
    const body = rows.map((arr, i) => `<row r="${i + 2}">${cellsFor(arr, i + 2)}</row>`).join("");
    const parts = {
      "[Content_Types].xml": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`,
      "_rels/.rels": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`,
      "xl/workbook.xml": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${escXml(sheetName)}" sheetId="1" r:id="rId1"/></sheets></workbook>`,
      "xl/_rels/workbook.xml.rels": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`,
      "xl/styles.xml": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><sz val="11"/><b/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>`,
      "xl/worksheets/sheet1.xml": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData><row r="1">${hdr}</row>${body}</sheetData></worksheet>`,
    };
    const zipFiles = Object.entries(parts).map(([n, s]) => ({ name: n, data: encStr(s) }));
    return makeZip(zipFiles);
  }
  function downloadBytes(bytes, filename, mime) {
    const blob = new Blob([bytes], { type: mime });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }

  /* ---- 檔案確認單 XLSX 匯出（含回填的長度與單價） ---- */
function exportConfirmXlsx(o) {
    const conf = confFor(o.order_no);
    const files = o.files || [];
    const isDtfr = getFilePrefix(o.product_type) === "DTFR";
    if (!isDtfr) {
      const unit = unitOf(o);
      const rows = files.map((f, i) => {
        const price = Number(conf.rows[i]?.price) || 0;
        return [o.order_no, o.customer_name, fmtDate(o.created_at), o.product_type, i + 1, f.name, f.qty || 1, price, (f.qty || 1) * price];
      });
      const total = (conf.rows || []).reduce((s, r, i) => s + (Number(r.price) || 0) * ((files[i] && files[i].qty) || 1), 0);
      if (rows.length) rows.push(["合計", "", "", "", "", "", "", "", total]);
      const headers = ["訂單編號","客戶名稱","下單日期","產品類型","序號","圖檔","數量","單價(NT$/"+unit+")","金額(NT$)"];
      const bytes = buildXlsx("檔案確認單", headers, rows);
      downloadBytes(bytes, `檔案確認單_${o.order_no}.xlsx`, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
      return;
    }
    const [w1, l1] = parseDim(o.size);
    const rows = files.map((f, i) => {
      const len = Number(conf.rows[i]?.len) || (Number(l1) || 0);
      return [o.order_no, o.customer_name, fmtDate(o.created_at), o.product_type, i + 1, f.name, f.qty || 1, w1, len];
    });
    const totalLen = (conf.rows || []).reduce((s, r, i) => s + (Number(r.len) || (Number(l1) || 0)), 0);
    if (rows.length) {
      rows.push(["合計總長度(m)", "", "", "", "", "", "", "", totalLen]);
      rows.push(["單價(NT$/m)", "", "", "", "", "", "", "", Number(conf.price) || 0]);
      rows.push(["費用(NT$)", "", "", "", "", "", "", "", (totalLen && conf.price) ? totalLen * Number(conf.price) : 0]);
    }
    const headers = ["訂單編號","客戶名稱","下單日期","產品類型","序號","圖檔","數量","寬(mm)","長度(m)"];
    const bytes = buildXlsx("檔案確認單", headers, rows);
    downloadBytes(bytes, `檔案確認單_${o.order_no}.xlsx`, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  }

  /* ---- 列印單（派工單 / 品管確認單） ---- */
  function openDoc(title, bodyHtml, orderNo) {
    const w = window.open("", "_blank", "width=980,height=760");
    if (!w) { alert("無法開啟列印視窗（瀏覽器可能擋了彈出視窗）"); return; }
    w.document.write(`<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><title>${esc(title)} ${esc(orderNo)}</title><style>
      @page { size: A4; margin: 14mm; }
      body { font-family: "Microsoft JhengHei", "Segoe UI", sans-serif; color: #111; font-size: 13px; margin: 0; }
      .print-bar { position: fixed; top: 0; left: 0; right: 0; background: #0f2537; color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 12px; z-index: 99; }
      .print-bar span { flex: 1; }
      .print-bar button { padding: 8px 18px; border: 0; border-radius: 6px; background: #fff; color: #0f2537; font-weight: 700; cursor: pointer; }
      .sheet { max-width: 210mm; margin: 0 auto; padding: 20mm 10mm 10mm; }
      .doc-title { text-align: center; font-size: 24px; font-weight: 700; letter-spacing: 3px; margin: 0 0 2px; }
      .doc-sub { text-align: center; font-size: 12px; color: #555; margin-bottom: 14px; }
      table.grid { width: 100%; border-collapse: collapse; margin-bottom: 12px; table-layout: fixed; }
      table.grid th, table.grid td { border: 1px solid #000; padding: 5px 8px; font-size: 12px; vertical-align: top; word-break: break-all; }
      table.grid th { background: #ececec; text-align: center; font-weight: 700; }
      .lbl { background: #f4f4f4; font-weight: 700; text-align: center; width: 18%; }
      .val { width: 32%; }
      .sec-h { font-size: 13px; font-weight: 700; margin: 14px 0 6px; border-left: 4px solid #0f2537; padding-left: 8px; }
      .sig { display: flex; justify-content: space-between; margin-top: 34px; }
      .sig div { width: 42%; border-top: 1px solid #000; padding-top: 4px; text-align: center; font-size: 12px; }
      @media print { .print-bar { display: none; } .sheet { padding: 0; } }
    </style></head><body>
    <div class="print-bar"><span>${esc(title)} · ${esc(orderNo)}</span><button onclick="window.print()">列印 / 另存 PDF</button></div>
    <div class="sheet">${bodyHtml}</div>
    </body></html>`);
    w.document.close();
    w.focus();
  }
  function pairRows(rows) {
    const html = rows.map(([l, v]) => `<tr><td class="lbl">${esc(l)}</td><td class="val">${esc(String(v ?? ""))}</td></tr>`).join("");
    return `<table class="grid"><colgroup><col style="width:20%"><col style="width:30%"><col style="width:20%"><col style="width:30%"></colgroup><tbody>${html}</tbody></table>`;
  }
  function orderBase(o) {
    return [
      ["訂單編號", o.order_no],
      ["客戶名稱", o.customer_name],
      ["下單日期", fmtDate(o.created_at)],
      ["交貨日", o.due_date],
    ];
  }
  function printWork(o) {
    const files = o.files || [];
    const nums = fileNumbers(o);
    const fdRows = files.map((f, i) =>
      `<tr><td style="text-align:center;width:6%">${i + 1}</td><td style="text-align:center;width:20%;font-weight:700">${esc(nums[i])}</td><td>${esc(f.name)}</td><td style="text-align:center;width:14%">${f.qty || 1}</td><td style="text-align:center;width:10%">${esc(o.size || "")}</td></tr>`)
      .join("");
    const body = `
      <div class="doc-title">派工單</div>
      <div class="doc-sub">Aceeprint 愛色智能印刷 · 生產工單</div>
      ${pairRows([...orderBase(o), ["產品類型", o.product_type], ["材質", o.material]])}
      <div class="sec-h">工作內容（檔案編號為重新命名後之生產編號）</div>
      <table class="grid">
        <colgroup><col style="width:6%"><col style="width:20%"><col style="width:40%"><col style="width:14%"><col style="width:10%"></colgroup>
        <tr><th>序</th><th>檔案編號</th><th>原始檔名</th><th>數量</th><th>尺寸</th></tr>
        ${fdRows || "<tr><td colspan='5' style='text-align:center'>無檔案</td></tr>"}
      </table>
      <div class="sec-h">後加工需求</div><div style="min-height:22px">${esc(o.finish || "")}</div>
      <div class="sec-h">備註 / 特殊要求</div><div style="min-height:22px">${esc(o.notes || "")}</div>
      <div class="sig"><div>承辦人</div><div>完成簽收 / 日期</div></div>`;
    openDoc("派工單", body, o.order_no);
  }
  function printQc(o) {
    const totalQty = (o.files || []).reduce((s, f) => s + (Number(f.qty) || 0), 0) || o.quantity || 0;
    const body = `
      <div class="doc-title">品管確認單</div>
      <div class="doc-sub">Aceeprint 愛色智能印刷 · 品質檢驗</div>
      ${pairRows([...orderBase(o), ["印製數量", `${o.quantity || totalQty} ${o.unit || ""}`], ["材質", o.material]])}
      <div class="sec-h">檢驗項目</div>
      <table class="grid">
        <colgroup><col style="width:34%"><col style="width:22%"><col style="width:22%"><col style="width:22%"></colgroup>
        <tr><th>檢驗項目</th><th>合格</th><th>不合格</th><th>備註</th></tr>
        <tr><td>尺寸 / 出血正確</td><td style="height:26px"></td><td></td><td></td></tr>
        <tr><td>色彩 / 對色</td><td style="height:26px"></td><td></td><td></td></tr>
        <tr><td>材質正確</td><td style="height:26px"></td><td></td><td></td></tr>
        <tr><td>數量正確</td><td style="height:26px"></td><td></td><td></td></tr>
        <tr><td>外觀（髒污 / 刮傷 / 殘膠）</td><td style="height:26px"></td><td></td><td></td></tr>
      </table>
      <div class="sec-h">後加工需求</div><div style="min-height:22px">${esc(o.finish || "")}</div>
      <div class="sec-h">備註 / 特殊要求</div><div style="min-height:22px">${esc(o.notes || "")}</div>
      <div class="sig"><div>品檢員</div><div>覆核 / 日期</div></div>`;
    openDoc("品管確認單", body, o.order_no);
  }

  function confirmSection(o, idx) {
    const conf = confFor(o.order_no);
    const isDtfr = getFilePrefix(o.product_type) === "DTFR";
    const files = o.files || [];
    const unit = unitOf(o);
    if (!isDtfr) {
      const rowsHtml = files.map((f, i) => {
        const price = Number(conf.rows[i]?.price) || 0;
        const amt = (f.qty || 1) * price;
        return `<tr data-i="${i}" data-q="${f.qty || 1}">
          <td style="text-align:center">${i + 1}</td>
          <td>${esc(f.name)}</td>
          <td style="text-align:center">${f.qty || 1}</td>
          <td><input class="c-price" type="number" min="0" step="0.01" value="${esc(price || "")}"> <span class="price-unit" data-unit="${unit}">NT$/${unit}</span></td>
          <td class="c-amt" style="text-align:right">${fmtMoney(amt)}</td>
        </tr>`;
      }).join("");
      const totalAmt = (conf.rows || []).reduce((s, r, i) => s + (Number(r.price) || 0) * ((files[i] && files[i].qty) || 1), 0);
      const totalQty = files.reduce((s, f) => s + (Number(f.qty) || 0), 0);
      return `
        <div class="confirm" data-cblock="${o.order_no}">
          <div class="confirm-head">
            <span style="font-weight:600">檔案確認單（試算表）· Σ（數量 × 單價）＝費用</span>
            <button class="pb-xls" data-action="xls" data-idx="${idx}">↓ 匯出 XLSX</button>
          </div>
          <table class="conf-table">
            <tr><th>序</th><th>圖檔</th><th>數量(${unit})</th><th>單價</th><th>金額(NT$)</th></tr>
            ${rowsHtml || "<tr><td colspan='5' style='text-align:center'>無檔案</td></tr>"}
            <tr class="conf-total"><td colspan="4">合計（${totalQty} ${unit}）</td><td id="tot-amt-${o.order_no}">${fmtMoney(totalAmt)}</td></tr>
          </table>
        </div>`;
    }
    const [w1, l1] = parseDim(o.size);
    const width = Number(w1) || 0;
    const rowsHtml = files.map((f, i) => {
      const len = Number(conf.rows[i]?.len) || (Number(l1) || 0);
      return `<tr data-i="${i}">
        <td style="text-align:center">${i + 1}</td>
        <td>${esc(f.name)}</td>
        <td style="text-align:center">${f.qty || 1}</td>
        <td style="text-align:center" class="${width > 572 ? "warn" : ""}" title="${width > 572 ? "寬度超過 572mm" : ""}">${w1 ?? ""}${width > 572 ? " ⚠" : ""}</td>
        <td><input class="c-len" type="number" min="0" step="0.01" value="${esc(len || "")}" placeholder="m"></td>
      </tr>`;
    }).join("");
    const totalLen = (conf.rows || []).reduce((s, r) => s + (Number(r.len) || 0), 0);
    const fee = totalLen > 0 && Number(conf.price) > 0 ? totalLen * Number(conf.price) : 0;
    return `
      <div class="confirm" data-cblock="${o.order_no}" data-islen="1">
        <div class="confirm-head">
          <span style="font-weight:600">檔案確認單（試算表）· 合計總長度 × 單價 = 費用</span>
          ${`<span class="dtfr-note">▲ DTF R to R 以圖檔長度計價</span>`}
          <button class="pb-xls" data-action="xls" data-idx="${idx}">↓ 匯出 XLSX</button>
        </div>
        <table class="conf-table">
          <tr><th>序</th><th>圖檔</th><th>數量</th><th>寬(mm)</th><th>長度(m)</th></tr>
          ${rowsHtml || "<tr><td colspan='5' style='text-align:center'>無檔案</td></tr>"}
          <tr class="conf-total">
            <td colspan="4">合計總長度</td>
            <td id="tot-len-${o.order_no}">${totalLen ? fmtDec(totalLen) + " m" : ""}</td>
          </tr>
        </table>
        <div class="conf-foot">
          ${width > 572 ? `<span class="warn-note">⚠ 寬度 ${width}mm，不得超過 572mm，請與客戶確認</span>` : ""}
          <span>單價：<input class="c-price" type="number" min="0" step="0.01" value="${esc(conf.price || "")}" placeholder="NT$/m"> NT$/m</span>
          <span>費用：<b id="fee-${o.order_no}" style="color:#2e7d46">${fmtMoney(fee)}</b> NT$</span>
        </div>
      </div>`;
  }

  async function load() {
    const api = $("api2").value.trim().replace(/\/+$/, "");
    const box = $("list");
    box.innerHTML = "<div class='empty'>讀取中…</div>";
    let ordersData;
    try {
      const r = await fetch(api + "/api/orders", { headers: getAuthHeaders() });
      if (r.status === 401) { logout(); throw new Error("登入已過期，請重新登入"); }
      if (!r.ok) throw new Error("HTTP " + r.status);
      ordersData = await r.json();
    } catch (e) {
      box.innerHTML = "<div class='empty err'>讀取失敗：" + esc(e.message) + "</div>";
      return;
    }
    orders = ordersData;
    if (!orders || !orders.length) { box.innerHTML = "<div class='empty'>目前沒有訂單</div>"; return; }
    box.innerHTML = orders.map((o, idx) => {
      const files = o.files || [];
      const totalQty = files.reduce((s, f) => s + (Number(f.qty) || 0), 0);
      const logo = o.logistics_method;
      let addr = "";
      if (String(logo).includes("門市") || String(logo).includes("超商") || String(logo).includes("ezShip")) {
        addr = kv("門市", o.store_name || o.st_name) + kv("門市代碼", o.st_code) + kv("門市地址", o.st_addr);
      } else {
        addr = kv("收件人", o.recipient_name || o.rv_name) + kv("收件電話", o.recipient_phone || o.rv_phone)
             + kv("收件地址", o.recipient_address || o.rv_addr || o.rv_address);
      }
      const fileRows = files.map((f, i) =>
        `<div class="frow"><span class="nm">${esc(f.name)}</span><span class="qty">× ${f.qty || 1} · ${fmtSize(f.size)}</span>` +
        `<a class="dl" href="${api}/api/orders/${o.order_no}/files/${i}/download?token=${encodeURIComponent(localStorage.getItem(TOKEN_KEY))}" download>下載</a></div>`
      ).join("");
      return `<div class="card">
        <div class="top">
          <span class="no">#${esc(o.order_no)}</span>
          <span class="st ${stateCls(o.status)}">${esc(stateLbl(o.status))}</span>
        </div>
        <div class="meta">
          ${kv("下單時間", fmtDate(o.created_at, true))}
          ${kv("委製人", o.customer_name)}
          ${kv("聯絡人", o.contact_name)}
          ${kv("手機", o.phone)}
          ${kv("統編", o.tax_id)}
          ${kv("LINE ID", o.line_id)}
          ${kv("產品類型", o.product_type)}
          ${kv("數量", o.quantity)}
          ${kv("計價單位", o.unit)}
          ${kv("尺寸", o.size)}
          ${kv("材質", o.material)}
          ${kv("後加工", o.finish)}
          ${kv("緊急程度", o.priority)}
          ${kv("交貨日", o.due_date)}
          ${kv("物流", o.logistics_method)}
          ${addr}
          ${kv("順豐運單號", (o.sf && (o.sf.waybill_no || "")) || "")}
          ${kv("備註", o.notes)}
        </div>
        <div class="files">
          <div style="font-weight:600;margin-bottom:4px">檔案（${files.length} 個 · 共 ${totalQty} 次印製）</div>
          ${fileRows || "<div style='color:#999;font-size:13px'>無檔案</div>"}
          ${files.length ? `<a class="zipbtn" href="${api}/api/orders/${o.order_no}/download?token=${encodeURIComponent(localStorage.getItem(TOKEN_KEY))}">↓ 整包 ZIP 一次下載</a>` : ""}
        </div>
        ${confirmSection(o, idx)}
        <div class="pb-row">
          <button class="pb-work" onclick="printWork(orders[${idx}])">W 派工單</button>
          <button class="pb-qc" onclick="printQc(orders[${idx}])">QC 品管確認單</button>
        </div>
      </div>`;
    }).join("");

    // 事件繫結：長度/單價輸入即重算；匯出 XLSX
    box.querySelectorAll(".c-len, .c-price").forEach(inp => {
      inp.addEventListener("input", () => {
        const b = inp.closest("[data-cblock]");
        if (b) recalcBlock(b.getAttribute("data-cblock"));
      });
    });
    box.querySelectorAll("[data-action='xls']").forEach(btn => {
      btn.addEventListener("click", () => exportConfirmXlsx(orders[Number(btn.getAttribute("data-idx"))]));
    });
  }

  initAuth();
</script>
</body>
</html>
