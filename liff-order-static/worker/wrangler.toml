name = "shubei-liff-order"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
MAX_FILE_MB = "95"
ZIP_MAX_MB = "95"

# 前端網域；要暫時允許本機測試時，加進 CORS_ORIGINS
CORS_ORIGINS = "https://aceeprint.vercel.app"

# 定期清理：建立超過 N 天且「尚未傳檔」的訂單會在每日 cron 中被清除（0 = 停用）
CLEANUP_AFTER_DAYS = "60"

[triggers]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "shubei-orders"
database_id = "b79351fa-9cb5-429b-a490-0add01f40b71"

[[r2_buckets]]
binding = "R2"
bucket_name = "shubei-orders-files"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "4b497e1bfb304bdcbb5c3b9a63429901"