name = "shubei-liff-order"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MAX_FILE_MB = "95"
ZIP_MAX_MB = "95"

# 順豐 IUOP 電子運單：
# 敏感憑證以 wrangler secret 儲存（SF_APP_KEY / SF_APP_SECRET / SF_AES_KEY / SF_CUSTOMER_CODE / SF_MONTHLY_CARD）
# msgType 依要下單的接口調整（IUOP_CREATE_ORDER / IECS_CREATE_ORDER …）
SF_MSG_TYPE = "IUOP_CREATE_ORDER"

# 寄件人（店家）資料——託運單上這欄要正確
SF_SENDER_COMPANY = "數倍科技"
SF_SENDER_CONTACT = "數倍科技"
SF_SENDER_MOBILE = "0921053426"
SF_SENDER_PROVINCE = "新北市"
SF_SENDER_CITY = "新店區"
SF_SENDER_COUNTY = ""
SF_SENDER_ADDRESS = "寶興路45巷9弄1號2樓"

# 前端網域；要暫時允許本機測試時，加進 CORS_ORIGINS
CORS_ORIGINS = "https://aceeprint.vercel.app"

# 定期清理：建立超過 N 天且「尚未傳檔」的訂單會在每日 cron 中被清除（0 = 停用）
CLEANUP_AFTER_DAYS = "60"

[triggers]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "shubei-orders"
database_id = "b79351fa-9cb5-429b-a490-0add01f40b71"

[[r2_buckets]]
binding = "R2"
bucket_name = "shubei-orders-files"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "4b497e1bfb304bdcbb5c3b9a63429901"