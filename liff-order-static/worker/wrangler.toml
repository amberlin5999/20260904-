name = "shubei-liff-order"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
MAX_FILE_MB = "95"
ZIP_MAX_MB = "95"

# 順豐速運電子運單憑證（向順豐開放平台申請）
# 因屬敏感資訊，改以 wrangler secret 儲存（wrangler secret put SF_PARTNER_ID 等）
SF_ENV = "sandbox"

# 寄件人（公司）資料——託運單上這欄要正確
SF_SENDER_COMPANY = "數倍DTF"
SF_SENDER_CONTACT = ""
SF_SENDER_MOBILE = ""
SF_SENDER_PROVINCE = ""
SF_SENDER_CITY = ""
SF_SENDER_COUNTY = ""
SF_SENDER_ADDRESS = ""

# 前端網域；要暫時允許本機測試時，加進 CORS_ORIGINS
CORS_ORIGINS = "https://aceeprint.vercel.app"

# 定期清理：建立超過 N 天且「尚未傳檔」的訂單會在每日 cron 中被清除（0 = 停用）
CLEANUP_AFTER_DAYS = "60"

[triggers]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "shubei-orders"
database_id = "b79351fa-9cb5-429b-a490-0add01f40b71"

[[r2_buckets]]
binding = "R2"
bucket_name = "shubei-orders-files"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "4b497e1bfb304bdcbb5c3b9a63429901"